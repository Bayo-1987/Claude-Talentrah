name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # CI runs on Groq, not Gemini — Gemini's shared 20-req/day free-tier quota
  # is exactly what used to make CI flaky/blocked (src/lib/llm/). Production
  # stays on Gemini; this only affects the CI job's own runs.
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  LLM_PROVIDER: groq
  PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
  NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      # TEMPORARY, again — re-confirming after the rebase onto post-PR#2
      # main, per branch-reconciliation step 2: a clean rebase doesn't
      # guarantee nothing shifted underneath it. Same pattern as before,
      # remove once confirmed.
      - name: TEMP — re-verify GROQ_API_KEY works live post-rebase
        run: |
          echo "GROQ_API_KEY: present (length ${#GROQ_API_KEY})"
          # max_tokens=20 (the first pass here) turned out too tight — this
          # model's reasoning-token spend at "low" effort varies run to run
          # (6-12 tokens observed), and at 20 total budget that occasionally
          # starves the visible answer to empty content with finish_reason:
          # length, even though the HTTP call itself succeeds. Confirmed via
          # 5 live retries at max_tokens=20 (1 empty out of 5) vs 5/5 clean
          # at max_tokens=1536 (Farah chat's real budget, finish_reason:
          # stop every time) — not a rebase regression, just an undersized
          # smoke-test budget. Using 100 here for real margin, and actually
          # failing the step (not just logging) if content comes back empty.
          curl -sf https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"Say OK."}],"max_tokens":100,"reasoning_effort":"low"}' \
            -o /tmp/groq-verify.json
          echo "Response:"
          cat /tmp/groq-verify.json
          python3 -c "
          import json, sys
          with open('/tmp/groq-verify.json') as f:
              d = json.load(f)
          content = d['choices'][0]['message']['content']
          print()
          if not content:
              print('FAILED: Groq returned empty content.')
              sys.exit(1)
          print('Live Groq call succeeded post-rebase. Content:', repr(content))
          "

      # TEMPORARY — branch-reconciliation step 2 asks for both providers
      # re-verified post-rebase, not just the one this task is about.
      - name: TEMP — re-verify GEMINI_API_KEY works live post-rebase
        run: |
          echo "GEMINI_API_KEY: present (length ${#GEMINI_API_KEY})"
          curl -sf "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"role":"user","parts":[{"text":"Say OK."}]}],"generationConfig":{"maxOutputTokens":20,"thinkingConfig":{"thinkingLevel":"MINIMAL"}}}' \
            -o /tmp/gemini-verify.json
          echo "Response:"
          cat /tmp/gemini-verify.json
          python3 -c "
          import json
          with open('/tmp/gemini-verify.json') as f:
              d = json.load(f)
          text = d['candidates'][0]['content']['parts'][0]['text']
          print()
          print('Live Gemini call succeeded post-rebase. Text:', repr(text))
          "

  e2e:
    name: Playwright e2e
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start app
        run: npm run start &

      - name: Wait for app to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App never came up." >&2
          exit 1

      - name: Seed demo data
        env:
          SEED_APP_URL: http://localhost:3000
        run: npm run seed

      - name: Run Playwright suite
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
