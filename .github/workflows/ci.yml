name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# ── STAGE 2: no more shared Supabase project to serialize against ──────────
#
# Every job below starts its OWN ephemeral local Supabase stack (see
# .github/actions/local-supabase) instead of reading and writing the single
# shared hosted "Talentrah CI" project. That project is what the concurrency
# group and .github/scripts/wait-for-ci-lock.sh existed to protect: three
# separate incidents (an egress blowout, a catalog-reseed race between
# overlapping runs, and a cross-branch migration collision — applying a
# migration to the shared project makes it live for every branch's CI
# instantly, whether or not that branch's own code has merged yet) all came
# from runs contending over one live database with no staging tier in front
# of it. A per-job local database has nothing to contend over: it is created
# fresh, used by exactly one job, and discarded with the runner. There is
# still no reason for two jobs on the SAME run to fight each other, but that
# was never what the old lock was for — it was always about DIFFERENT runs.
#
# .github/scripts/wait-for-ci-lock.sh is left in place, unreferenced, rather
# than deleted here — this migration hasn't yet been proven stable over a run
# of real GitHub Actions pushes (no Docker in the environment that wrote this,
# so it could not be dry-run locally first). Delete the script in a follow-up
# once local Supabase has held up in practice; reintroducing the lock would
# otherwise mean reconstructing all of the above from git blame.
#
# The Vercel-project egress this was also meant to protect against the
# approaching 2026-10-02 free-tier cap: CI no longer touches that project's
# database at all, so CI's contribution to that number is now ~0 rather than
# whatever `npm run seed`'s real ingestion HTTP calls plus every suite's reads
# and writes previously cost it.

env:
  # CI runs on Groq, not Gemini — Gemini's shared 20-req/day free-tier quota
  # is exactly what used to make CI flaky/blocked (src/lib/llm/). Production
  # stays on Gemini; this only affects the CI job's own runs. GEMINI_API_KEY
  # is intentionally NOT a GitHub Actions secret — CI must never be able to
  # call real Gemini, even by accident; it's Vercel-only.
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  LLM_PROVIDER: groq
  # Demo-account password for scripts/seed.ts and the masthead-nav e2e spec.
  # Not a literal in the repo any more — see scripts/seed.ts.
  DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
  PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
  NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # No `needs:` — this is cheap and must report even when the build is
    # broken. It fails the job on any match, which fails the PR; a scanner
    # that only warns is a scanner people learn to scroll past, and this
    # repo's own history is the argument for that not being optional.
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to resolve base..head below. A shallow clone has no merge
          # base, and gitleaks would silently scan nothing.
          fetch-depth: 0

      - name: Install gitleaks
        id: install
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's own
          # checksums file. Pinned and verified: this step downloads a binary
          # and runs it over the repo, so an unpinned URL would be a supply
          # chain hole opened by the very job meant to close one.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Retry: this download 403'd once on a PR and the job reported it as
          # "a secret-shaped value was found", which was false and alarming.
          # GitHub's release CDN rate-limits, so a transient failure here is
          # expected occasionally and is not a finding.
          for attempt in 1 2 3; do
            if curl -sSfL --retry 2 --retry-delay 3 "$url" -o gitleaks.tar.gz; then
              break
            fi
            echo "gitleaks download attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          if [ ! -s gitleaks.tar.gz ]; then
            echo "::error::Could not download gitleaks after 3 attempts. This is a TOOLING failure, not a leak."
            exit 1
          fi
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Determine commit range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Everything this PR adds on top of its base.
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # First push of a new branch — no previous SHA to diff against.
            range="${{ github.sha }}~1..${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Scanning $range"

      - name: Scan for secrets
        id: scan
        run: |
          set -euo pipefail
          # --redact matters more than it looks: Actions logs on a PUBLIC repo
          # are public, so a scanner that prints the value it found would leak
          # it a second time, in a place nobody thinks to rotate.
          ./gitleaks git . \
            --config .gitleaks.toml \
            --log-opts "${{ steps.range.outputs.range }}" \
            --redact \
            --no-banner \
            --verbose

      # Scoped to the SCAN step, not the whole job.
      #
      # This used to be a bare `if: failure()`, so ANY failure in the job —
      # including gitleaks failing to download — printed "A secret-shaped value
      # was found in this change." That happened, and the message was simply
      # untrue. A security check that cries wolf on its own tooling failures is
      # one people learn to dismiss, which costs more than the false alarm.
      - name: What to do if this failed
        if: failure() && steps.scan.outcome == 'failure'
        run: |
          echo "::error::A secret-shaped value was found in this change."
          echo "Do NOT just delete the line and force-push. This repo is public:"
          echo "anything pushed must be assumed captured, so ROTATE the credential"
          echo "first, then remove it. See docs/secrets-audit.md."
          echo "If it is genuinely not a secret, add it to the allowlist in"
          echo ".gitleaks.toml WITH a comment saying why — an undocumented"
          echo "allowlist entry is how the next real one gets waved through."

      - name: Tooling failure notice
        if: failure() && steps.install.outcome == 'failure'
        run: |
          echo "::error::The secret scan could not RUN — gitleaks failed to install."
          echo "This is NOT a finding. Nothing was scanned, so nothing was cleared"
          echo "either: re-run the job before merging, and do not read a green"
          echo "PR as evidence this change was scanned."

  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Start local Supabase
        uses: ./.github/actions/local-supabase

      # Reference data before the unit tests, deliberately.
      #
      # `npm run seed` needs a dev server (it drives the real ingestion routes)
      # so it lives in the Playwright job, which is `needs: checks`. On a
      # database that has never been seeded the unit tests therefore run first,
      # fail on a missing catalog, and skip the job that would have fixed it.
      # That deadlock cost a red run the first time this suite was pointed at
      # the CI project.
      #
      # This step is catalog only — templates, packs, passes, scholarships —
      # writes straight to the database with no app involved, and is idempotent,
      # so running it on every job is cheap and safe.
      - name: Seed reference data
        run: npm run seed:catalog

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

  e2e:
    name: Playwright e2e
    # No longer needed for shared-database ordering (this job now has its own
    # local Supabase stack, per the Stage 2 note above) — kept because failing
    # fast on a typecheck/lint/unit-test break is still worth not spending the
    # ~10 minutes this job takes to build and run Playwright.
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Before the build, deliberately: NEXT_PUBLIC_* vars are inlined into
      # the client bundle at BUILD time, not read at runtime. Starting this
      # after `npm run build` would ship a build pointed at nothing.
      - name: Start local Supabase
        uses: ./.github/actions/local-supabase

      - name: Build app
        run: npm run build

      # The admin routes fail closed: with no INGEST_SECRET configured they
      # answer 401, which is the point of the guard. `npm run seed` drives the
      # real ingestion route over HTTP, so this job has to present a
      # credential. Generated per-run rather than stored as a repository
      # secret: the value only has to match between the server started below
      # and the seed step, and a throwaway value cannot leak anything.
      - name: Generate a per-run admin secret
        run: echo "INGEST_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start app
        env:
          # The golden path drives the real routes, gating, ledger and UI —
          # only the model itself is swapped out (src/lib/llm/stub-provider.ts).
          # Without this the suite would make real LLM calls on every PR:
          # slow, billable, and flaky on a shared rate limit. The suite
          # asserts this is active and refuses to run otherwise.
          LLM_PROVIDER: stub
        run: npm run start &

      - name: Wait for app to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App never came up." >&2
          exit 1

      - name: Seed demo data
        env:
          SEED_APP_URL: http://localhost:3000
        run: npm run seed

      - name: Run Playwright suite
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
