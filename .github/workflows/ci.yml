name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# ── STAGE 2: no more shared Supabase project to serialize against ──────────
#
# Every job below starts its OWN ephemeral local Supabase stack (see
# .github/actions/local-supabase) instead of reading and writing the single
# shared hosted "Talentrah CI" project. That project is what the concurrency
# group and .github/scripts/wait-for-ci-lock.sh existed to protect: three
# separate incidents (an egress blowout, a catalog-reseed race between
# overlapping runs, and a cross-branch migration collision — applying a
# migration to the shared project makes it live for every branch's CI
# instantly, whether or not that branch's own code has merged yet) all came
# from runs contending over one live database with no staging tier in front
# of it. A per-job local database has nothing to contend over: it is created
# fresh, used by exactly one job, and discarded with the runner. There is
# still no reason for two jobs on the SAME run to fight each other, but that
# was never what the old lock was for — it was always about DIFFERENT runs.
#
# .github/scripts/wait-for-ci-lock.sh WAS left in place, unreferenced, until
# this migration had been proven over real pushes. It has now been, so the
# script is deleted — `git log -- .github/scripts/wait-for-ci-lock.sh` still has
# its reasoning and its measurements if the lock ever needs rebuilding. Two of
# its properties are worth carrying forward, because a naive reimplementation
# would lose both: it gave up after MAX_WAIT_SECONDS and proceeded anyway with a
# warning, and its blocker query ended `2>/dev/null || true`, so an API error
# read as "lock acquired" — it failed OPEN.
#
# The Vercel-project egress this was also meant to protect against the
# approaching 2026-10-02 free-tier cap: CI no longer touches that project's
# database at all, so CI's contribution to that number is now ~0 rather than
# whatever `npm run seed`'s real ingestion HTTP calls plus every suite's reads
# and writes previously cost it.

env:
  # CI runs on Groq, not Gemini — Gemini's shared 20-req/day free-tier quota
  # is exactly what used to make CI flaky/blocked (src/lib/llm/). Production
  # stays on Gemini; this only affects the CI job's own runs. GEMINI_API_KEY
  # is intentionally NOT a GitHub Actions secret — CI must never be able to
  # call real Gemini, even by accident; it's Vercel-only.
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  LLM_PROVIDER: groq
  # Demo-account password for scripts/seed.ts and the masthead-nav e2e spec.
  # Not a literal in the repo any more — see scripts/seed.ts.
  DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
  PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
  NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}

jobs:
  migration-collisions:
    name: Migration numbering
    runs-on: ubuntu-latest
    # PULL REQUESTS ONLY. On a push to main the collision has already landed —
    # this exists to stop it landing, and running it post-merge would just be a
    # second, later way of learning what `Start local Supabase` already failed
    # on. The drift check is the one that watches main; this one watches the
    # door.
    if: github.event_name == 'pull_request'
    # No `needs:` — cheap, and it must report even when the build is broken.
    # It is also the fastest signal on the PR by a wide margin, which matters
    # because the failure it prevents is the one that looks like somebody
    # else's fault.
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits is enough to diff this branch against a freshly
          # fetched main; the script fetches main itself rather than relying
          # on the checkout's depth.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check migration numbers against origin/main
        run: npm run check-migration-collisions

      - name: What to do if this failed
        if: failure()
        run: |
          echo "A migration on this branch reuses a number already on main."
          echo
          echo "This is not a style rule. supabase_migrations.schema_migrations is"
          echo "keyed on the filename's numeric prefix, so two files sharing one is a"
          echo "primary-key collision that kills 'supabase db reset' before any test"
          echo "runs — on main, for every branch, not just this one. It has happened"
          echo "six times (0060, 0103, 0106, 0110 twice, 0113) and taken main red at"
          echo "least three of those."
          echo
          echo "Fix: rename your migration to the next free number, update every"
          echo "in-repo reference to the old name, and push again. This repo's"
          echo "convention is that whichever lands SECOND renumbers."
          echo
          echo "NOTE: passing this check does not fully close the race. Two open PRs"
          echo "can each pass against a main holding neither, and the second to land"
          echo "still collides. GitHub's 'Require branches to be up to date before"
          echo "merging' is what forces a re-run against the latest main at merge"
          echo "time, and that setting is the other half of this."

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # No `needs:` — this is cheap and must report even when the build is
    # broken. It fails the job on any match, which fails the PR; a scanner
    # that only warns is a scanner people learn to scroll past, and this
    # repo's own history is the argument for that not being optional.
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to resolve base..head below. A shallow clone has no merge
          # base, and gitleaks would silently scan nothing.
          fetch-depth: 0

      - name: Install gitleaks
        id: install
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's own
          # checksums file. Pinned and verified: this step downloads a binary
          # and runs it over the repo, so an unpinned URL would be a supply
          # chain hole opened by the very job meant to close one.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Retry: this download 403'd once on a PR and the job reported it as
          # "a secret-shaped value was found", which was false and alarming.
          # GitHub's release CDN rate-limits, so a transient failure here is
          # expected occasionally and is not a finding.
          for attempt in 1 2 3; do
            if curl -sSfL --retry 2 --retry-delay 3 "$url" -o gitleaks.tar.gz; then
              break
            fi
            echo "gitleaks download attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          if [ ! -s gitleaks.tar.gz ]; then
            echo "::error::Could not download gitleaks after 3 attempts. This is a TOOLING failure, not a leak."
            exit 1
          fi
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Determine commit range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Everything this PR adds on top of its base.
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # First push of a new branch — no previous SHA to diff against.
            range="${{ github.sha }}~1..${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Scanning $range"

      - name: Scan for secrets
        id: scan
        run: |
          set -euo pipefail
          # --redact matters more than it looks: Actions logs on a PUBLIC repo
          # are public, so a scanner that prints the value it found would leak
          # it a second time, in a place nobody thinks to rotate.
          ./gitleaks git . \
            --config .gitleaks.toml \
            --log-opts "${{ steps.range.outputs.range }}" \
            --redact \
            --no-banner \
            --verbose

      # Scoped to the SCAN step, not the whole job.
      #
      # This used to be a bare `if: failure()`, so ANY failure in the job —
      # including gitleaks failing to download — printed "A secret-shaped value
      # was found in this change." That happened, and the message was simply
      # untrue. A security check that cries wolf on its own tooling failures is
      # one people learn to dismiss, which costs more than the false alarm.
      - name: What to do if this failed
        if: failure() && steps.scan.outcome == 'failure'
        run: |
          echo "::error::A secret-shaped value was found in this change."
          echo "Do NOT just delete the line and force-push. This repo is public:"
          echo "anything pushed must be assumed captured, so ROTATE the credential"
          echo "first, then remove it. See docs/secrets-audit.md."
          echo "If it is genuinely not a secret, add it to the allowlist in"
          echo ".gitleaks.toml WITH a comment saying why — an undocumented"
          echo "allowlist entry is how the next real one gets waved through."

      - name: Tooling failure notice
        if: failure() && steps.install.outcome == 'failure'
        run: |
          echo "::error::The secret scan could not RUN — gitleaks failed to install."
          echo "This is NOT a finding. Nothing was scanned, so nothing was cleared"
          echo "either: re-run the job before merging, and do not read a green"
          echo "PR as evidence this change was scanned."

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # No `needs:` — same reasoning as the secrets job right above: cheap,
    # and must report even when the build itself is broken.
    #
    # Blocking, not report-only: the tree was swept clean (0 findings) as
    # part of adding this job (a genuine critical unauthenticated-RCE
    # advisory against the exact Next.js version this repo had pinned,
    # GHSA-p293-qw3h-jr36, plus three transitive high-severity findings).
    # `--audit-level=high` — a MODERATE/LOW finding still gets triaged via
    # the Dependabot PRs configured in .github/dependabot.yml, just not as
    # a hard CI gate; this only stops a HIGH-or-worse one from merging
    # silently. Revisit the level (not the existence of the gate) if a
    # low-severity backlog ever makes this noisy.
    #
    # ONE TIME-BOXED EXCEPTION, issue #687. GHSA-vfj7-8cjw-p6xm (braces <=
    # 3.0.3, a stack-exhaustion DoS) has NO patched version and reaches us only
    # through a lint-time chain (braces <- micromatch <- fast-glob <-
    # @next/eslint-plugin-next <- eslint-config-next), so the bare
    # `npm audit --audit-level=high` sat red on every PR. Two runs now:
    #   1. the FULL tree through scripts/check-dependency-audit.ts, which
    #      allows exactly the advisory ids listed in scripts/audit-exceptions.ts
    #      (never a package name), each with an expiry date (this one:
    #      2026-11-03). After it the step fails again, naming #687, until
    #      someone removes or renews the entry on purpose;
    #   2. the PRODUCTION tree (`--omit=dev`) with --strict: NO exceptions, so a
    #      high finding in anything that ships fails whatever the list says.
    # `|| true` after `npm audit --json` only lets the script read the report
    # (npm exits non-zero when it finds something); the script itself FAILS if the
    # audit did not run or the output is not an audit report.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm audit, full tree (high and above; one time-boxed exception, see #687)
        run: |
          npm audit --json > audit-full.json || true
          npx tsx scripts/check-dependency-audit.ts audit-full.json

      # if: always() so a red full-tree run does not hide the production result.
      - name: npm audit, production tree (--omit=dev, no exceptions)
        if: always()
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          npx tsx scripts/check-dependency-audit.ts --strict audit-prod.json

  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    # Measured 7.5-8.6 min; 25 is roughly three times that. A hung step must fail this required check, not hold it for the six-hour default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Start local Supabase
        uses: ./.github/actions/local-supabase

      # Reference data before the unit tests, deliberately.
      #
      # This step is catalog only — templates, packs, passes, scholarships —
      # writes straight to the database with no app involved, and is idempotent,
      # so running it on every job is cheap and safe.
      - name: Seed reference data (catalog)
        run: npm run seed:catalog

      # FULL seed too, discovered necessary by Stage 2 itself, not assumed
      # up front. On the old shared hosted project this job's unit tests never
      # needed this: the database was long-lived, so by the time `checks` ran,
      # some PAST run of the `e2e` job's `npm run seed` had already left demo
      # users, an internal posting, ingested job postings and payment/ledger
      # rows sitting there. Several unit tests quietly depended on that —
      # tests/seo/landing-page-links.test.ts asserting Lagos/remote postings
      # exist, tests/billing/pricing-catalog-rebase.test.ts asserting retired
      # packs still have payment_transactions rows, tests/rls/
      # org-and-referral-scoping.test.ts and tests/seed/catalog.test.ts both
      # literally erroring "run `npm run seed` first" — a real, message-level
      # admission that they were never designed to run against catalog data
      # alone. A fresh per-job database has no such leftovers, so this now has
      # to be run here explicitly rather than borrowed by accident from
      # whatever the last e2e run happened to leave behind.
      #
      # This needs a running app (`npm run seed` drives real ingestion HTTP
      # routes), so this job now also builds and starts one — the same shape
      # `e2e` uses below, duplicated rather than shared because these are
      # separate GitHub Actions runners with no way to hand off a live
      # container between them. Real, measured cost of full per-job isolation:
      # two builds and two real ingestion sweeps per CI run instead of one.
      # A pg_dump/restore of `checks`' already-seeded database into `e2e`
      # instead of re-seeding there is the obvious follow-up if that cost
      # turns out to matter in the measured wall-clock — not done here so the
      # first attempt at Stage 2 stays checkable against a plain, unoptimised
      # baseline before optimising it.
      - name: Build app
        run: npm run build

      - name: Generate a per-run admin secret
        run: echo "INGEST_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start app
        env:
          LLM_PROVIDER: stub
        run: npm run start &

      - name: Wait for app to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App never came up." >&2
          exit 1

      - name: Seed demo data (full)
        env:
          SEED_APP_URL: http://localhost:3000
        run: npm run seed

      # Regression tripwire, not a today-is-broken alarm — see
      # scripts/check-bundle-size.ts for why the classic Next build-output
      # size table isn't what this reads (Turbopack dropped it) and for how
      # the budget numbers below were measured. Runs against the SAME
      # already-built, already-started app the seed step just used above —
      # no second build. NEXT_PUBLIC_SUPABASE_URL / _ANON_KEY /
      # SUPABASE_SERVICE_ROLE_KEY come from the "Start local Supabase" step
      # earlier in this job; the script mints and deletes its own throwaway
      # signed-in session to reach the two auth-gated routes.
      - name: Bundle size budget (client JS, key routes)
        run: npm run check-bundle-size

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

  # ── E2E SHARDS ──────────────────────────────────────────────────────────
  #
  # The Playwright suite is split across three runners with Playwright's own
  # `--shard=i/3`. Each shard job is a full copy of the old single job (its OWN
  # ephemeral local Supabase stack, its own build, its own seed), so shards
  # cannot share or race on database state. The job named "Playwright e2e"
  # below is NOT a shard: it is the aggregator that branch protection requires
  # by that exact name, and it is red unless every shard is green. Rename the
  # aggregator and the required check silently goes missing; tests/ci/
  # e2e-shards-workflow.test.ts pins the name and the shard count.
  e2e-shard:
    name: Playwright e2e shard ${{ matrix.shard }}/3
    strategy:
      # One failing shard must not cancel the others: every red is wanted at once.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # No longer needed for shared-database ordering (this job now has its own
    # local Supabase stack, per the Stage 2 note above) — kept because failing
    # fast on a typecheck/lint/unit-test break is still worth not spending the
    # ~10 minutes this job takes to build and run Playwright.
    needs: checks
    runs-on: ubuntu-latest
    # Measured 9.8-12.2 min per shard (setup included); 30 is about 2.5 times that. On 7 Oct one shard sat 23 minutes in the browser install and
    # starved a required check for the whole PR.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        # Normally about 22 seconds, but the download both hangs (a shard sat 23 minutes in it on 7 Oct) and is refused (cdn.playwright.dev 403, twice,
        # 0.4 s, on #820). So: each attempt is cut off after 120 s, up to three attempts with a short sleep between them (3 x 120 s + 15 s is under
        # the step limit), and a third failure fails the step loudly. Plain shell, no third-party action; tests/ci/ci-timeouts.test.ts runs this
        # script against a fake npx.
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if timeout 120 npx playwright install --with-deps chromium; then
              echo "playwright browsers installed on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::playwright install attempt ${attempt} of 3 failed"
            [ "${attempt}" -lt 3 ] && sleep $((attempt * 5))
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      # pdftoppm: e2e/resume-print-margins.spec.ts rasterises a printed PDF to
      # measure the white space at each page break. Without it that spec skips
      # itself (loudly), so a missing package here would turn a real check into
      # a silent pass.
      - name: Install poppler (pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # Before the build, deliberately: NEXT_PUBLIC_* vars are inlined into
      # the client bundle at BUILD time, not read at runtime. Starting this
      # after `npm run build` would ship a build pointed at nothing.
      - name: Start local Supabase
        uses: ./.github/actions/local-supabase

      - name: Build app
        run: npm run build

      # The admin routes fail closed: with no INGEST_SECRET configured they
      # answer 401, which is the point of the guard. `npm run seed` drives the
      # real ingestion route over HTTP, so this job has to present a
      # credential. Generated per-run rather than stored as a repository
      # secret: the value only has to match between the server started below
      # and the seed step, and a throwaway value cannot leak anything.
      - name: Generate a per-run admin secret
        run: echo "INGEST_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start app
        env:
          # The golden path drives the real routes, gating, ledger and UI —
          # only the model itself is swapped out (src/lib/llm/stub-provider.ts).
          # Without this the suite would make real LLM calls on every PR:
          # slow, billable, and flaky on a shared rate limit. The suite
          # asserts this is active and refuses to run otherwise.
          LLM_PROVIDER: stub
        run: npm run start &

      - name: Wait for app to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App never came up." >&2
          exit 1

      - name: Seed demo data
        env:
          SEED_APP_URL: http://localhost:3000
        run: npm run seed

      - name: Run Playwright suite (shard ${{ matrix.shard }} of 3)
        env:
          E2E_BASE_URL: http://localhost:3000
        # `list` keeps the per-test lines in this job's log; `blob` is what the
        # aggregator merges into one report (the CLI flag overrides the
        # config's html reporter for this run only).
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --reporter=list,blob

      - name: Upload this shard's blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: warn

      # Only when this shard failed: test-results/ holds each failing test's trace and page snapshot (playwright.config.ts keeps a trace for a failing
      # test only). Never uploaded on a pass, so a green run costs no extra size or time.
      - name: Upload this shard's failure traces and snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The required check. Branch protection asks for "Playwright e2e" by name, so
  # this job keeps it. It merges the shards' blob reports into ONE report (the
  # per-test lines of the whole suite, in this job's log, so a by-name read is
  # in one place) and then decides the result.
  #
  # Result rule: green ONLY when every shard succeeded. A failed, cancelled or
  # skipped shard is red. Nothing skips e2e on purpose today (this workflow has
  # no `paths:` filter and the shard job has no `if:`); the one way the shards
  # skip is `needs: checks` failing, and that must be red here too, because a
  # skipped required check can read as passing. `if: always()` makes this job
  # run in all of those cases instead of being skipped itself.
  e2e:
    name: Playwright e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download the shards' blob reports
        if: needs.e2e-shard.result != 'skipped'
        uses: actions/download-artifact@v7
        with:
          pattern: blob-report-shard-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge the shards into one report
        if: needs.e2e-shard.result != 'skipped'
        # A failed shard may have produced no blob; merging what exists is still
        # worth having, and its absence is already red through the result rule.
        continue-on-error: true
        run: npx playwright merge-reports --reporter=list,html ./all-blob-reports

      - name: Upload the merged Playwright report
        if: always() && needs.e2e-shard.result != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Every shard must have succeeded
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e shards: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = "success" ]
