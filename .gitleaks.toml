# gitleaks configuration for Talentrah.
#
# WHY THIS FILE EXISTS AT ALL, rather than just running gitleaks with its
# defaults: the defaults would not have caught either of the two real
# credentials this repo actually leaked.
#
# Measured, not assumed — gitleaks 8.30.1, default config, against the three
# real secrets from the #24/#25 sweeps:
#
#   const DIAG_TOKEN = "957ad72…"        -> CAUGHT (generic-api-key)
#   const DEMO_PASSWORD = "TalentrahDemo123!"   -> MISSED
#   password: "TalentrahDemoFriend123!"         -> MISSED
#
# The default rules are tuned for machine-generated provider keys: long,
# high-entropy, recognisable prefixes. A human-chosen password clears none of
# those bars. Both of this repo's real leaks were human-chosen passwords, and
# the second one survived a manual sweep, so the whole point of adding a
# scanner is lost if it only looks for the shape we never leaked.
#
# `useDefault = true` keeps every upstream rule; the rule below adds the shape
# we actually get wrong.

title = "Talentrah"

[extend]
useDefault = true

[[rules]]
id = "talentrah-hardcoded-credential"
description = "Password, secret, token or key assigned to a string literal"
# Deliberately no entropy threshold. "TalentrahDemo123!" is low-entropy by
# design — it was typed by a person — and an entropy floor is exactly what let
# the defaults through. False positives are handled by the allowlist below,
# which is cheaper than missing a real one.
#
# Excludes `$` inside the literal so interpolated values don't match:
# `password: `seed-${randomBytes(24)…`` is a generated value, not a secret.
# Values assigned from process.env have no quotes and never match.
#
# The name is matched with `[A-Za-z0-9_]*` on both sides rather than `\b`,
# which is not a nitpick — it is the difference between catching this repo's
# first leak and not. `\b` does not match between `_` and `P`, because `_` is
# a word character, so a `\bpassword` rule sails straight past
# `const DEMO_PASSWORD = "…"`. Verified: with `\b`, 1 of the 3 known real
# secrets is caught; with this, all 3 are.
#
# `auth` is deliberately NOT in the name list. It was, and it matched `author:`
# in every blog post's frontmatter — four false positives on prose. Fixed in
# the rule rather than allowlisted, because "allowlist each author's name" is a
# list that only ever grows. `token` already covers authToken / auth_token; the
# one thing genuinely given up is a bare `authorization_code = "…"`, which this
# codebase only ever reads from the database.
regex = '''(?i)(?:^|[^A-Za-z0-9_])([A-Za-z0-9_]*(?:pass(?:word|wd)?|secret|token|api[_-]?key|apikey|credential)[A-Za-z0-9_]*)\s*[:=]\s*["'`]([^"'`\n$]{8,})["'`]'''
secretGroup = 2
keywords = [
  "password",
  "passwd",
  "secret",
  "token",
  "apikey",
  "api_key",
  "api-key",
  "credential",
]

# ---------------------------------------------------------------------------
# Allowlist.
#
# Every entry here is a documented decision, not a silence. An unhandled false
# positive is how a check stops being taken seriously — the first time it cries
# wolf on a fixture string, someone adds `--no-verify` and the check is over.
# So: allowlist narrowly, by exact value, with the reason written down.
#
# Both entries below were classified as false positives by the full-history
# sweep in docs/secrets-audit.md. Neither is a credential.
# ---------------------------------------------------------------------------
[allowlist]
description = "Documented false positives — see docs/secrets-audit.md"

regexes = [
  # tests/rls/cross-user.test.ts — the string user A stores in a resume so the
  # suite can prove user B cannot read it. Its whole purpose is to be a
  # recognisable marker in an assertion. Not a credential.
  '''A-private-resume''',

  # src/lib/jobs/sources.config.ts — Greenhouse's public job-board slug for
  # Moniepoint. It is a path segment in a public URL
  # (boards-api.greenhouse.io/v1/boards/moniepoint/jobs), not a token, despite
  # the field being named `token` by Greenhouse's own API.
  '''moniepoint''',

  # src/lib/jobs/sources.config.ts — Apollo Agriculture's public Lever
  # board slug, same shape as moniepoint above: a path segment in a public,
  # unauthenticated URL (api.lever.co/v0/postings/apolloagriculture and
  # jobs.lever.co/apolloagriculture), not a credential, despite Lever also
  # calling the field `token`. wavemm1 and jumia (the two new Greenhouse
  # slugs added alongside this one) are under the rule's 8-character
  # minimum and never matched in the first place — this is the only new
  # slug from that change long enough to need allowlisting.
  '''apolloagriculture''',

  # src/lib/jobs/sources.config.ts, Stage 9 (2026-09-04) — four more
  # Greenhouse public board slugs, same shape as moniepoint/apolloagriculture
  # above: each is a path segment in a public, unauthenticated URL
  # (boards-api.greenhouse.io/v1/boards/<slug>/jobs), not a credential.
  # `educate` (the fifth slug added in the same change) is under the rule's
  # 8-character minimum and never matched in the first place.
  '''oneacrefund''',
  '''alxafrica''',
  '''scangroup''',
  '''oafkenya''',

  # src/lib/jobs/sources.config.ts, Workable round 2 (2026-09-06) — five
  # per-company Workable widget-API account slugs, same shape as `kuda`'s
  # own token above (`kuda` itself is under the 8-character minimum and
  # never matched in the first place): each is a path segment in a public,
  # unauthenticated URL
  # (apply.workable.com/api/v1/widget/accounts/<slug>), not a credential,
  # despite Workable also calling the field `token`.
  '''renmoney''',
  '''get-reliance-health''',
  '''alaro-city''',
  '''tetramaritime''',
  '''fairmoney''',

  # tests/auth/one-tap-client.test.ts, Google One Tap (2026-09-06) — three
  # fixture values for a mocked Supabase client, never a real credential:
  # a fake JWT-shaped string in the exact `header.payload.signature` shape
  # (no real segment is ever base64 in a fixture, since nothing decodes it),
  # and the two literal strings `access-token`/`refresh-token` used as a
  # fake session's token fields. The whole point of these three values is to
  # be an obviously-fake, human-readable placeholder in an assertion, the
  # same role `A-private-resume` plays above.
  '''header\.payload\.signature''',
  '''access-token''',
  '''refresh-token''',

  # src/components/jobs/promoted-click-tracker.tsx (0128) —
  # `credentials: "same-origin"` is a literal, standard Fetch API request
  # option (the browser's own vocabulary for which cookies to send), not a
  # credential value. It only matches this rule because `credential` is one
  # of the rule's own trigger keywords and the fetch option happens to be
  # spelled the same way. There is no secret here to rotate.
  '''same-origin''',

  # tests/llm/jd-extraction-provider.test.ts, Stage 8 Step 1b — four
  # human-readable fixture values exercising the isolation guard that stops
  # this feature from silently sharing Farah's Groq token budget
  # (GroqJdExtractionProvider throws if JD_EXTRACTION_GROQ_API_KEY ===
  # GROQ_API_KEY). Each is assigned directly to `process.env.*_API_KEY` in a
  # test, matching this rule's own keyword list — but the whole point of
  # these specific strings is to be an obviously-fake placeholder in an
  # assertion, the same role `access-token`/`refresh-token` play above. None
  # of them is shaped like a real Groq key (`gsk_...`), and no real network
  # call is ever made in this test file (the `openai` SDK is mocked at the
  # module boundary).
  '''same-key-both-vars''',
  '''farahs-production-key''',
  '''a-genuinely-different-isolated-key''',
  '''isolated-key''',

  # tests/lib/analytics/posthog.test.ts — assigned directly to
  # process.env.POSTHOG_API_KEY, matching this rule's own keyword list for
  # the same reason as the jd-extraction-provider.test.ts entries above:
  # the whole point of this string is to be an obviously-fake placeholder
  # that makes captureEvent() take its "configured" branch in a test, never
  # a real PostHog project key (which is prefixed phc_ and never looks like
  # this). No real network call is made in this test file — posthog-node's
  # PostHog client is mocked at the module boundary.
  '''posthog-test-placeholder''',

  # tests/demo/jd-demo-route-attempts.test.ts, PR #667 (P1, 2026-10-02) — one
  # exact sentinel value: the string the test pastes as a visitor's "job
  # description" to prove that pasted text never reaches the attempt log (it
  # asserts the logged row does not contain `CONFIDENTIAL`). A human-readable
  # marker, not a credential; nothing to rotate. It matched this rule only
  # because the constant was first named SECRET_JD ("secret" is one of the
  # rule's own trigger words). The constant is renamed, but the first commit
  # that carried it is already in the PR's history and this scan reads
  # commits, so the value is allowlisted. ANCHORED to exactly that value (the
  # literal in the test has one trailing space, hence the optional space):
  # no wildcard, and it does NOT relax the rule for anything else.
  '''^CONFIDENTIAL-PASTE-9f3a[ ]?$''',

  # tests/billing/deleted-user-payment.test.ts, PR #671 (send-512, 2026-10-02) — one exact test value: the HMAC key the test signs a fake Paystack
  # webhook body with, so the route's signature check accepts it (`process.env.PAYSTACK_SECRET_KEY` is set to the same string for the duration of the
  # test; the route is called in-process and no network call or real Paystack key is involved). It is a human-readable fixture, not a credential:
  # nothing to rotate, and it protects nothing. It matched this rule because the constant was first named SECRET. The test now generates the
  # key at run time, but the first commit that carried the literal is already in the PR's history and this scan reads commits, so the value is
  # allowlisted. ANCHORED to exactly that value: no wildcard, and it does NOT relax the rule for anything else.
  '''^test-secret$''',

  # tests/billing/paystack-deactivate-authorization.test.ts and tests/lib/email/resend-deletion-guard.test.ts, PR #686 (ACCT-1, 2026-10-03) — two exact test
  # values, each assigned to a `process.env.*` name so the code under test takes its "configured" branch: a made-up Paystack secret key and a made-up Resend
  # key. Human-readable fixtures, not credentials (neither has a real provider's shape or entropy, no network call is made: `fetch` is stubbed and the
  # `resend` package is mocked), nothing to rotate. They matched this rule because the variable names contain `secret` and `api_key`. Both files now
  # generate the value at run time, but the first commits that carried the literals are already in the PR's history and this scan reads commits, so
  # the values are allowlisted. ANCHORED to exactly those values: no wildcard, and it does NOT relax the rule for anything else.
  '''^sk_test_not_a_real_key$''',
  '''^re_test_key_not_real$''',

  # tests/lib/account-deletion/provider-cancel.test.ts, PR #686 — one more exact test value, from the same PR and for the same kind of test: a made-up key
  # that the "no key, code, email or message text ever reaches a log" test puts inside a fake Paystack error message, to prove it never reaches a log line.
  # It matched gitleaks' default Stripe rule only because it is shaped sk_test_ followed by alphanumerics; it is not a Stripe key, belongs to no
  # account, and protects nothing. The test now assembles it at run time, but the first commit that carried the literal is already in the PR's history
  # and this scan reads commits, so the value is allowlisted. ANCHORED to exactly that value: no wildcard, and it does NOT relax any rule for anything else.
  '''^sk_test_leakleakleak$''',
]

paths = [
  # A structural snapshot of the live schema: policy expressions, column
  # defaults, function bodies. It contains no values — by construction, since
  # it was generated from the catalog, not from data. It does contain the word
  # "secret" in policy prose and would otherwise churn on every schema change.
  '''supabase/migrations/0000_baseline_schema\.sql''',

  # Documents the leaked values on purpose, so the next person can recognise
  # them. They are all rotated and confirmed dead; re-flagging them here would
  # make the audit unpublishable.
  '''docs/secrets-audit\.md''',

  # This file's own header quotes the leaked shapes as evidence.
  '''\.gitleaks\.toml''',

  # Auto-generated by `supabase init` (2026-09-03, for the local-Supabase-in-CI
  # spike) — never hand-edited for a real value. Every field this rule could
  # match here is Supabase's own `env(VARIABLE_NAME)` indirection convention
  # (e.g. `secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"`,
  # `s3_secret_key = "env(S3_SECRET_KEY)"`) — the literal string is a
  # placeholder telling the CLI which environment variable to read at
  # container start, not a credential, by construction of the template
  # itself. Same reasoning as the 0000_baseline_schema.sql entry above: a
  # generated, structural file that cannot contain a real secret value.
  '''supabase/config\.toml''',

  # tests/support/credential-shaped-fixtures.txt, PR #680 (2026-10-02) — the fixtures for
  # tests/ci/no-credential-shaped-identifiers.test.ts: lines that are deliberately shaped like credentials
  # (a SECRET_ name assigned a literal, an API_KEY, a password) so the test can prove its scanner flags them.
  # Every value in it is made up. It exists so that no .ts file has to contain such lines: the first version of
  # that test spelled them inline and this repo's own Secret scan rejected it four times (two by the custom rule,
  # two by the default generic-api-key rule). EXACT PATH, anchored: it does not exempt any other file.
  '''^tests/support/credential-shaped-fixtures\.txt$''',
]
