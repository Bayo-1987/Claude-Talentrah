<!--
  send-395 — signup confirmation, sent by Supabase's own mailer
  (supabase.auth.signUp() / supabase.auth.resend({ type: "signup" }),
  src/lib/auth/actions.ts), not Resend. Same visual language as
  src/lib/email/layout.ts's renderBrandedEmail() — cream background, ink
  text, rust-brown accent, serif headline, one button style — hand-copied
  rather than imported, because this file is rendered by Supabase's own Go
  template engine outside the Next.js app entirely; there is no shared
  module boundary to import across. If layout.ts's EMAIL_COLORS ever
  change, this file (and recovery.html / invite.html) need the same edit
  made by hand — that drift risk is inherent to this being a second
  runtime, not something this send can close the way the Resend templates
  did by importing a shared helper.

  Talentrah voice (not Farah's) for this one — §6.10's own split reserves
  Farah's first-person voice for "relationship-y" notifications (matches,
  referrals); an account-confirmation email is a factual/system action,
  not a match or a referral, so it speaks as Talentrah.

  The ConfirmationURL merge field is the one link every Supabase auth
  template should use for its primary action — it already embeds the
  token hash, the correct `type=` parameter for THIS template, and the
  caller's own `emailRedirectTo` (src/lib/auth/actions.ts passes
  `${origin}/auth/callback?next=/onboarding`), so this file does not
  hand-construct a URL from the raw token/token-hash fields itself — doing
  that from a generic copied example is exactly how the wrong `type=`
  parameter ends up in the link.

  DELIBERATELY NO OTHER MERGE FIELD NAME APPEARS ANYWHERE ELSE IN THIS
  COMMENT, including as prose: Supabase's html/template engine evaluates
  every {{ }} action it finds in the raw file, INCLUDING inside an HTML
  comment — a field name written here in doubled-brace syntax as
  documentation would actually be evaluated and substituted (and for the
  raw token/token-hash fields, would leak a real, sensitive auth token
  into the email's HTML source, invisible in a rendered client but present
  in the raw markup, for zero purpose). Caught by manually checking every
  {{ }} pair in this file before trusting it, the same discipline this
  repo applies to code — the first draft of this file got this wrong.
-->
<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f7f3ec;">
    <div style="max-width:560px;margin:0 auto;">
      <img
        src="{{ .SiteURL }}/icons/talentrah-mark-48.png"
        width="40"
        height="40"
        alt="Talentrah"
        style="display:block;border:0;margin-bottom:20px;"
      />
      <p style="font:400 15px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#2b2119;">
        Welcome to Talentrah.
      </p>
      <p style="font:400 15px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#2b2119;">
        Confirm your email address to start matching with real jobs across Nigeria and Africa, and get your resume tailored for the ones worth applying to.
      </p>
      <p style="margin:24px 0;">
        <a
          href="{{ .ConfirmationURL }}"
          style="display:inline-block;background:#2b2119;color:#f7f3ec;text-decoration:none;padding:12px 20px;font:600 14px/1 -apple-system,Segoe UI,Roboto,sans-serif;"
        >
          Confirm your email
        </a>
      </p>
      <p style="font:400 15px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#2b2119;">
        — The Talentrah team
      </p>
      <p style="font:400 12px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:#6b5c50;border-top:1px solid #d9cfc2;padding-top:12px;">
        If you didn&rsquo;t create a Talentrah account, you can safely ignore this email.
      </p>
    </div>
  </body>
</html>
